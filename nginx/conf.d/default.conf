# Virtual Host configuration for example.com
#
# You can move that to a different file under sites-available/ and symlink that
# to sites-enabled/ to enable it.
#
server {
       listen 80;
    #    listen [::]:80;
# }

# server {
#          listen 443 ssl;
#          http2 on;
# #         listen [::]:443 ssl http2;
#          server_name  tools.claroeng.net;
#         client_max_body_size 10M;

#          ssl_certificate     /etc/ssl/private/cert.pem;
#          ssl_certificate_key /etc/ssl/private/cert.key;
        server_name dvsupplychain.com;
        root /data; 
        index index.html;
        location ~* \.(ogg|ogv|svg|svgz|eot|otf|woff|woff2|mp4|mp3|ttf|css|rss|atom|js|jpg|jpeg|gif|png|ico|zip|tgz|gz|rar|bz2|doc|xls|exe|ppt|tar|mid|midi|wav|bmp|rtf)(\?ver=[0-9.]+)?$ {
            # alias /app/build
            access_log off;
            log_not_found off;
            expires 365d;
            add_header Cache-Control "public";
            add_header X-Custom-HeaderCatchAll "Value for Custom Header CatchAll";
        }
        location /nginx_status {
                stub_status on;
                allow 127.0.0.1;
                deny all;
        }

        # Only because of /index.html here, we have to write seperate block for products
        location / {
            try_files $uri $uri.html /index.html;
            add_header X-Custom-HeaderHome "Value for Custom Header Home";
         }
        location /favicon.ico {
            log_not_found off;
            alias /favicon/favicon.ico;
            try_files $uri /favicon/$uri =202;
            expires 365d;
            add_header Cache-Control 'public';
            add_header X-Custom-Header_next "Value for favicon";
        }

}
