services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    depends_on:
      - web
    env_file:
      - .env
    restart: 'always'
  web:
    image: nginx:latest
    volumes:
      - ./nginx/conf.d/:/etc/nginx/conf.d:ro
      - ./nginx/favicon:/favicon:ro
      - ./Landing Page:/data

    healthcheck:
      test: ['CMD', 'service', 'nginx', 'status']
    restart: always

volumes:
  data:


