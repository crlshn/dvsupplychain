services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    depends_on:
      - web
    env_file:
      - .env
    restart: 'always'
#    restart: unless-stopped
    healthcheck:
#      test: ["CMD", "curl", "-f", "http://localhost:20241/metrics"]
#      test: ["CMD", "cloudflared", "version"]
#      test: ["CMD-SHELL", "wget --spider -q http://web || exit 1"]
#      test: ["CMD", "cloudflared", "tunnel", "ingress", "validate"]
#      test: ["CMD", "cloudflared", "user-agent", "http://localhost:20241/ready"]
#      test: ["CMD", "cloudflared", "user-agent", "http://web"]
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:20241", "ready"] #funciona
#      test: ["CMD", "cloudflared", "tunnel", "ingress", "validate", "--origin-url", "http://web"]
      interval: 30s
      timeout: 10s
      retries: 3
  web:
    image: nginx:latest
    volumes:
      - ./nginx/conf.d/:/etc/nginx/conf.d:ro
      - ./nginx/favicon:/favicon:ro
      - ./Landing Page:/data

    healthcheck:
      test: ['CMD', 'service', 'nginx', 'status']
    restart: always
#    restart: unless-stopped
volumes:
  data:


